; Devices for the scripting host tests. XMotor is the interesting one: it is configured with
; both IMotor and ISupportsHoming, which is what makes homing reachable from a script.

[XMotor]
_type = KJX.Devices.SimulatedLinearStepperMotor, KJX.Devices
_interface1 = KJX.Devices.IMotor, KJX.Devices
_interface2 = KJX.Devices.ISupportsInitialization, KJX.Devices
_interface3 = KJX.Devices.ISupportsHoming, KJX.Devices
Acceleration = 1
Velocity = 1

[YMotor]
_type = KJX.Devices.SimulatedLinearStepperMotor, KJX.Devices
_interface1 = KJX.Devices.IMotor, KJX.Devices
Acceleration = 1
Velocity = 1

[TemperatureSensor1]
_type = KJX.Devices.SimulatedTemperatureSensor, KJX.Devices
_interface1 = KJX.Devices.ISensor, KJX.Devices
_interface2 = KJX.Devices.ISupportsInitialization, KJX.Devices

[Bench]
_type = KJX.Tests.ScriptTestDevice, KJX.Tests
_interface1 = KJX.Tests.IScriptTestDevice, KJX.Tests
