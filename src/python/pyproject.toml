[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kjx-instrument"
version = "0.1.0"
description = "Python client for a KJX instrument's scripting API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["websockets>=12"]

[tool.setuptools]
packages = ["kjx_instrument"]
